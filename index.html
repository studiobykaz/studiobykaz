<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Travel Expenses Calculator | 東霖專用</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; }
        input[type="text"], input[type="number"] { -webkit-appearance: none; }
        .tab-active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
        .tab-inactive { color: #6b7280; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const App = () => {
            // --- 狀態 State ---
            const [users, setUsers] = useState(['Kevin']);
            const [expenses, setExpenses] = useState([]);
            
            // 貨幣Settings
            const [homeCurr, setHomeCurr] = useState('HKD');
            const [rates, setRates] = useState({ JPY: 0.053, CNY: 1.08, USD: 7.8, EUR: 8.5, GBP: 10.0, TWD: 0.25, KRW: 0.006, SGD: 7.4, AUD: 5.2, HKD: 1.0 });

            const [activeTab, setActiveTab] = useState('add');
            
            // 表單臨時狀態
            const [amount, setAmount] = useState('');
            const [currency, setCurrency] = useState('HKD');
            const [description, setDescription] = useState('');
            const [payer, setPayer] = useState(users[0] || 'Kevin');
            const [involved, setInvolved] = useState([]);
            const [newUserName, setNewUserName] = useState('');
            
            // 編輯狀態
            const [editingId, setEditingId] = useState(null);

            // --- 初始化與儲存 ---
            useEffect(() => {
                const savedData = localStorage.getItem('japanTripData_v3'); 
                if (savedData) {
                    const parsed = JSON.parse(savedData);
                    setUsers(parsed.users || ['Kevin']);
                    setExpenses(parsed.expenses || []);
                    setHomeCurr(parsed.homeCurr || 'HKD');
                    if (parsed.rates) setRates(parsed.rates);
                } else {
                    const oldData = localStorage.getItem('japanTripData_v2');
                    if (oldData) {
                        try {
                            const parsedOld = JSON.parse(oldData);
                            setUsers(parsedOld.users || ['Kevin']);
                            setHomeCurr(parsedOld.homeCurr || 'HKD');
                            if (parsedOld.expenses) {
                                let newRates = { ...rates };
                                setExpenses(parsedOld.expenses.map(e => {
                                    if (e.currency && e.exchangeRate) {
                                        newRates[e.currency] = e.exchangeRate;
                                    }
                                    return {
                                        date: e.date,
                                        amount: e.amount,
                                        currency: e.currency || 'HKD',
                                        description: e.description,
                                        payer: e.payer,
                                        involved: e.involved,
                                        id: e.id
                                    };
                                }));
                                setRates(newRates);
                            }
                        } catch(e) {}
                    }
                }
                setInvolved(users);
            }, []);

            useEffect(() => {
                const dataToSave = { users, expenses, homeCurr, rates };
                localStorage.setItem('japanTripData_v3', JSON.stringify(dataToSave));
            }, [users, expenses, homeCurr, rates]);

            useEffect(() => {
                if (involved.length === users.length - 1 && !editingId) {
                    setInvolved(users);
                }
            }, [users.length]);

            // --- 輔助 Functions ---
            const formatMoney = (curr, val) => {
                const formattedVal = curr.toUpperCase() === 'JPY' ? parseFloat(val).toFixed(0) : parseFloat(val).toFixed(2);
                return `${curr.toUpperCase()} ${formattedVal}`;
            };

            const formatHome = (val, includeSign = false) => {
                const num = parseFloat(val);
                const absVal = Math.abs(num).toFixed(2);
                if (includeSign) {
                    if (num > 0) return `+${homeCurr} ${absVal}`;
                    if (num < 0) return `-${homeCurr} ${absVal}`;
                }
                return `${homeCurr} ${absVal}`;
            };

            const resetForm = () => {
                setAmount('');
                setCurrency('HKD');
                setDescription('');
                setPayer(users[0] || '');
                setInvolved(users);
                setEditingId(null);
            };

            // --- 核心邏輯 ---
            const handleAddUser = () => {
                if (newUserName.trim() && !users.includes(newUserName.trim())) {
                    const updatedUsers = [...users, newUserName.trim()];
                    setUsers(updatedUsers);
                    if (!editingId) setInvolved(updatedUsers);
                    setNewUserName('');
                }
            };

            const handleRemoveUser = (userToRemove) => {
                if (confirm(`Are you sure you want to remove ${userToRemove} ? This will not delete past expenses, but will affect calculations.`)) {
                    setUsers(users.filter(u => u !== userToRemove));
                    setInvolved(involved.filter(u => u !== userToRemove));
                    if (payer === userToRemove) setPayer(users[0] || '');
                }
            };

            const handleSaveExpense = () => {
                if (!amount || parseFloat(amount) <= 0) return alert("Please enter a valid amount.");
                if (!currency.trim()) return alert("Please enter currency.");
                if (!description.trim()) return alert("請輸入Expense Description。");
                if (involved.length === 0) return alert("Please select at least one person to split with.");

                const expenseData = {
                    date: editingId ? expenses.find(e => e.id === editingId).date : new Date().toLocaleString('zh-HK', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                    amount: parseFloat(amount),
                    currency: currency.toUpperCase(),
                    description,
                    payer,
                    involved
                };

                if (editingId) {
                    setExpenses(expenses.map(exp => exp.id === editingId ? { ...expenseData, id: editingId } : exp));
                    alert("Successfully updated!");
                } else {
                    setExpenses([{ ...expenseData, id: Date.now() }, ...expenses]);
                    alert("Successfully updated!");
                }
                
                resetForm();
                if (editingId) setActiveTab('list');
            };

            const startEditExpense = (exp) => {
                setAmount(exp.amount);
                setCurrency(exp.currency || 'HKD');
                setDescription(exp.description);
                setPayer(exp.payer);
                setInvolved(exp.involved);
                setEditingId(exp.id);
                setActiveTab('add');
            };

            const deleteExpense = (id) => {
                if (confirm("Are you sure you want to delete this expense?")) {
                    setExpenses(expenses.filter(e => e.id !== id));
                    if (editingId === id) resetForm();
                }
            };

            const handleResetData = () => {
                if (confirm("⚠️ 警告：這將會清除「所有」Record紀錄與Group Members，無法復原！確定要重設嗎？")) {
                    if (confirm("Confirmation: Do you really want to clear all data?")) {
                        localStorage.removeItem('japanTripData_v3');
                        localStorage.removeItem('japanTripData_v2');
                        localStorage.removeItem('japanTripData_v1');
                        setUsers(['Kevin']);
                        setExpenses([]);
                        setHomeCurr('HKD');
                        setRates({ JPY: 0.053, CNY: 1.08, USD: 7.8, EUR: 8.5, GBP: 10.0, TWD: 0.25, KRW: 0.006, SGD: 7.4, AUD: 5.2, HKD: 1.0 });
                        resetForm();
                        setPayer('Kevin');
                        alert("資料已全部歸零。");
                    }
                }
            };

            // 複製到剪貼簿 (支援 iFrame 方案)
            const copyToClipboard = () => {
                let text = `💰 【Travel Expenses Summary】\n`;
                text += `Total Spent (${homeCurr}): ${formatHome(totalSpentHome)}\n\n`;
                
                text += `📋 --- Expense Details ---\n`;
                expenses.forEach((exp, i) => {
                    text += `${expenses.length - i}. ${exp.description} - ${formatMoney(exp.currency, exp.amount)} (${exp.payer} paid)\n`;
                    text += `   [Split: ${exp.involved.join(', ')}]\n`;
                });

                text += `\n⚖️ --- Final Settlement (${homeCurr}) ---\n`;
                if (settlementPlan.transactions.length === 0) {
                    text += `All settled!\n`;
                } else {
                    settlementPlan.transactions.forEach(t => {
                        text += `${t.from} gives ${t.to} ${formatHome(t.amount)}\n`;
                    });
                }
                
                text += `\n(Generated by Travel Expenses Calculator)`;

                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    alert('✅ Settlement Report Copied.');
                } catch (err) {
                    alert('複製失敗，請手動複製。');
                }
                document.body.removeChild(textArea);
            };

            // --- Settlement演算法 ---
            const settlementPlan = useMemo(() => {
                let balances = {};
                users.forEach(u => balances[u] = 0);

                expenses.forEach(exp => {
                    const paidBy = exp.payer;
                    const splitCount = exp.involved.length;
                    if (splitCount === 0) return;

                    const curr = (exp.currency || 'HKD').toUpperCase();
                    const rateVal = curr === homeCurr.toUpperCase() ? 1.0 : (rates[curr] !== undefined ? rates[curr] : 1.0);
                    const amountInHome = exp.amount * rateVal;
                    const splitAmount = amountInHome / splitCount;

                    if (balances[paidBy] !== undefined) balances[paidBy] += amountInHome;
                    exp.involved.forEach(person => {
                        if (balances[person] !== undefined) balances[person] -= splitAmount;
                    });
                });

                let debtors = [];
                let creditors = [];

                Object.keys(balances).forEach(user => {
                    const val = balances[user];
                    if (val < -0.01) debtors.push({ user, amount: val }); 
                    if (val > 0.01) creditors.push({ user, amount: val });
                });

                debtors.sort((a, b) => a.amount - b.amount); 
                creditors.sort((a, b) => b.amount - a.amount);

                let transactions = [];
                let dIndex = 0, cIndex = 0;

                while (dIndex < debtors.length && cIndex < creditors.length) {
                    let debtor = debtors[dIndex];
                    let creditor = creditors[cIndex];
                    let amount = Math.min(Math.abs(debtor.amount), creditor.amount);

                    transactions.push({ from: debtor.user, to: creditor.user, amount: amount });

                    debtor.amount += amount;
                    creditor.amount -= amount;

                    if (Math.abs(debtor.amount) < 0.01) dIndex++;
                    if (creditor.amount < 0.01) cIndex++;
                }

                return { balances, transactions };
            }, [expenses, users, rates, homeCurr]);

            const totalSpentHome = expenses.reduce((sum, item) => {
                const curr = (item.currency || 'HKD').toUpperCase();
                const rateVal = curr === homeCurr.toUpperCase() ? 1.0 : (rates[curr] !== undefined ? rates[curr] : 1.0);
                return sum + (item.amount * rateVal);
            }, 0);

            useEffect(() => {
                lucide.createIcons();
            }, [activeTab, expenses, users, editingId]);


            // --- UI 渲染 ---
            return (
                <div className="max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col relative">
                    
                    {/* Header */}
                    <header className="bg-blue-600 text-white p-4 sticky top-0 z-10 shadow-md">
                        <div className="flex justify-between items-center">
                            <div>
                                <h1 className="text-xl font-bold flex items-center gap-2">
                                    <i data-lucide="globe"></i> Travel Expenses Calculator
                                </h1>
                                <p className="text-xs text-blue-100 mt-1">
                                    Total Spent: {formatHome(totalSpentHome)}
                                </p>
                            </div>
                            <button onClick={() => setActiveTab('settings')} className="p-2 active:scale-95 transition">
                                <i data-lucide="settings"></i>
                            </button>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-1 overflow-y-auto pb-24 p-4">
                        
                        {/* Tab: Add/修改支出 (ADD/EDIT) */}
                        {activeTab === 'add' && (
                            <div className="space-y-6 animate-fade-in">
                                {editingId && (
                                    <div className="bg-yellow-50 text-yellow-800 p-2 rounded-lg text-sm flex justify-between items-center border border-yellow-200">
                                        <span className="font-bold flex items-center gap-1"><i data-lucide="pencil" size="14"></i> Editing Expense</span>
                                        <button onClick={resetForm} className="text-gray-500 hover:text-gray-800 px-2 py-1 bg-white rounded shadow-sm text-xs border border-gray-200">Cancel Edit</button>
                                    </div>
                                )}

                                <div className="bg-blue-50 p-4 rounded-xl border border-blue-100 space-y-4">
                                    <div>
                                        <label className="block text-sm text-gray-500 mb-1">Amount & Currency</label>
                                        <div className="flex gap-2">
                                            <input 
                                                type="number" 
                                                inputMode="decimal"
                                                value={amount} 
                                                onChange={(e) => setAmount(e.target.value)}
                                                className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-2xl font-bold text-gray-800"
                                                placeholder="0"
                                            />
                                            <select 
                                                value={currency} 
                                                onChange={(e) => setCurrency(e.target.value)}
                                                className="w-28 px-2 py-3 rounded-lg border border-gray-300 bg-white focus:ring-2 focus:ring-blue-500 outline-none text-base font-bold"
                                            >
                                                <option value="HKD">HKD</option>
                                                <option value="JPY">JPY</option>
                                                <option value="CNY">CNY</option>
                                                <option value="USD">USD</option>
                                                <option value="EUR">EUR</option>
                                                <option value="GBP">GBP</option>
                                                <option value="TWD">TWD</option>
                                                <option value="KRW">KRW</option>
                                                <option value="SGD">SGD</option>
                                                <option value="AUD">AUD</option>
                                            </select>
                                        </div>
                                    </div>

                                    {currency.toUpperCase() !== homeCurr.toUpperCase() && (
                                        <p className="text-right text-sm text-gray-500">
                                            ≈ {homeCurr} {(amount * (rates[currency.toUpperCase()] || 1.0)).toFixed(2)}
                                        </p>
                                    )}
                                </div>

                                <div>
                                    <label className="block text-sm text-gray-500 mb-1">Expense Description</label>
                                    <input 
                                        type="text" 
                                        value={description}
                                        onChange={(e) => setDescription(e.target.value)}
                                        className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none"
                                        placeholder="e.g., Sushiro, 7-11, Taxi"
                                    />
                                </div>

                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm text-gray-500 mb-1">Paid By?</label>
                                        <select 
                                            value={payer} 
                                            onChange={(e) => setPayer(e.target.value)}
                                            className="w-full px-3 py-3 rounded-lg border border-gray-300 bg-white focus:ring-2 focus:ring-blue-500 outline-none"
                                        >
                                            {users.map(u => <option key={u} value={u}>{u}</option>)}
                                        </select>
                                    </div>
                                    <div className="flex items-end">
                                        <button 
                                            onClick={handleSaveExpense}
                                            className={`w-full text-white font-bold py-3 rounded-lg shadow-lg active:scale-95 transition flex justify-center items-center gap-2 ${editingId ? 'bg-yellow-500' : 'bg-blue-600'}`}
                                        >
                                            <i data-lucide={editingId ? "save" : "plus"}></i> {editingId ? 'Save Changes' : 'Record'}
                                        </button>
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-sm text-gray-500 mb-2">Split With? (Click to toggle)</label>
                                    <div className="flex flex-wrap gap-2">
                                        {users.map(u => {
                                            const isSelected = involved.includes(u);
                                            return (
                                                <button 
                                                    key={u}
                                                    onClick={() => {
                                                        if (isSelected) {
                                                            setInvolved(involved.filter(i => i !== u));
                                                        } else {
                                                            setInvolved([...involved, u]);
                                                        }
                                                    }}
                                                    className={`px-4 py-2 rounded-full text-sm font-medium transition ${
                                                        isSelected 
                                                        ? 'bg-blue-100 text-blue-700 border-blue-200 border' 
                                                        : 'bg-gray-100 text-gray-400 border-transparent border'
                                                    }`}
                                                >
                                                    {u} {isSelected && '✓'}
                                                </button>
                                            )
                                        })}
                                    </div>
                                    <div className="mt-2 text-xs text-gray-400 text-right">
                                        {involved.length} people splitting, each {amount > 0 ? formatMoney(currency, amount / involved.length) : `${currency.toUpperCase()} 0`}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Tab: 列表 (LIST) */}
                        {activeTab === 'list' && (
                            <div className="space-y-4">
                                {expenses.length === 0 ? (
                                    <div className="text-center text-gray-400 mt-10">
                                        <p>No expense records yet</p>
                                    </div>
                                ) : (
                                    expenses.map(exp => (
                                        <div key={exp.id} className={`bg-white p-4 rounded-xl shadow-sm border ${editingId === exp.id ? 'border-yellow-400 bg-yellow-50' : 'border-gray-100'} flex justify-between items-start transition-colors`}>
                                            <div className="flex-1">
                                                <div className="flex justify-between items-baseline mb-1">
                                                    <h3 className="font-bold text-gray-800 text-lg">{exp.description}</h3>
                                                    <span className="font-mono font-bold text-blue-600">{formatMoney(exp.currency, exp.amount)}</span>
                                                </div>
                                                <div className="text-xs text-gray-500 flex flex-col gap-1">
                                                    <span>{exp.date} · <span className="text-gray-700 font-medium">{exp.payer}</span> paid</span>
                                                    <span>Split: {exp.involved.join(', ')}</span>
                                                </div>
                                            </div>
                                            <div className="ml-3 flex flex-col gap-2">
                                                <button onClick={() => startEditExpense(exp)} className="p-2 text-gray-400 hover:text-blue-500 transition bg-gray-50 rounded-full">
                                                    <i data-lucide="pencil" size="16"></i>
                                                </button>
                                                <button onClick={() => deleteExpense(exp.id)} className="p-2 text-gray-400 hover:text-red-500 transition bg-gray-50 rounded-full">
                                                    <i data-lucide="trash-2" size="16"></i>
                                                </button>
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        )}

                        {/* Tab: Settlement (SETTLE) */}
                        {activeTab === 'settle' && (
                            <div className="space-y-6">
                                <button 
                                    onClick={copyToClipboard}
                                    className="w-full bg-green-600 text-white font-bold py-3 rounded-lg shadow-md active:scale-95 transition flex justify-center items-center gap-2"
                                >
                                    <i data-lucide="copy"></i> Copy the data.
                                </button>

                                <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                    <h2 className="font-bold text-gray-800 mb-4 border-b pb-2">Who Owes Who? ({homeCurr})</h2>
                                    {settlementPlan.transactions.length === 0 ? (
                                        <p className="text-center text-green-500 font-bold py-4">All settled!</p>
                                    ) : (
                                        <div className="space-y-3">
                                            {settlementPlan.transactions.map((t, idx) => (
                                                <div key={idx} className="flex items-center justify-between bg-blue-50 p-3 rounded-lg">
                                                    <div className="flex items-center gap-2">
                                                        <span className="font-bold text-gray-700">{t.from}</span>
                                                        <span className="text-gray-400 text-xs">gives</span>
                                                        <span className="font-bold text-gray-700">{t.to}</span>
                                                    </div>
                                                    <div className="font-mono font-bold text-blue-600 text-lg">
                                                        {formatHome(t.amount)}
                                                    </div>
                                                </div>
                                            ))}
                                            <p className="text-xs text-gray-400 text-center mt-2">
                                                *Refer to above for individual payment.
                                            </p>
                                        </div>
                                    )}
                                </div>

                                <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                    <h2 className="font-bold text-gray-800 mb-4 border-b pb-2">Current Balance Status ({homeCurr})</h2>
                                    <div className="space-y-2">
                                        {Object.entries(settlementPlan.balances).map(([user, balance]) => (
                                            <div key={user} className="flex justify-between items-center text-sm">
                                                <span>{user}</span>
                                                <span className={`font-mono font-bold ${balance >= 0 ? 'text-green-500' : 'text-red-500'}`}>
                                                    {formatHome(balance, true)}
                                                </span>
                                            </div>
                                        ))}
                                        <p className="text-xs text-gray-400 mt-2">Positive = Total amount to receive<br/>Negative = Total amount to pay</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Tab: Settings (SETTINGS) */}
                        {activeTab === 'settings' && (
                            <div className="space-y-6">
                                <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                    <h3 className="font-bold text-gray-800 mb-3">Home Currency</h3>
                                    <div>
                                        <label className="block text-xs text-gray-500 mb-1">Base Home Currency</label>
                                        <select 
                                            value={homeCurr}
                                            onChange={(e) => setHomeCurr(e.target.value)}
                                            className="w-full p-3 border rounded-lg bg-white font-mono font-bold text-center text-base focus:ring-2 focus:ring-blue-500 outline-none"
                                        >
                                            <option value="HKD">HKD</option>
                                            <option value="JPY">JPY</option>
                                            <option value="CNY">CNY</option>
                                            <option value="USD">USD</option>
                                            <option value="EUR">EUR</option>
                                            <option value="GBP">GBP</option>
                                            <option value="TWD">TWD</option>
                                            <option value="KRW">KRW</option>
                                            <option value="SGD">SGD</option>
                                            <option value="AUD">AUD</option>
                                        </select>
                                    </div>
                                </div>

                                <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                    <h3 className="font-bold text-gray-800 mb-3">Exchange Rates (1 Forex = ? {homeCurr})</h3>
                                    <div className="space-y-3">
                                        {Object.keys(rates).filter(c => c !== homeCurr.toUpperCase()).map(curr => (
                                            <div key={curr} className="flex items-center gap-3">
                                                <span className="w-16 font-mono font-bold text-gray-700">{curr}</span>
                                                <input 
                                                    type="number" 
                                                    step="0.0001"
                                                    value={rates[curr]}
                                                    onChange={(e) => {
                                                        const val = parseFloat(e.target.value) || 0;
                                                        setRates({ ...rates, [curr]: val });
                                                    }}
                                                    className="flex-1 p-2 border rounded text-center font-mono font-bold bg-blue-50 focus:ring-2 focus:ring-blue-500 outline-none"
                                                />
                                                <span className="text-xs text-gray-400 w-12">{homeCurr}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                    <h3 className="font-bold text-gray-800 mb-3">Travel Buddy</h3>
                                    <div className="flex gap-2 mb-4">
                                        <input 
                                            type="text" 
                                            value={newUserName}
                                            onChange={(e) => setNewUserName(e.target.value)}
                                            placeholder="Enter name"
                                            className="flex-1 p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none"
                                        />
                                        <button 
                                            onClick={handleAddUser}
                                            className="bg-green-500 text-white px-4 py-2 rounded font-bold active:scale-95 transition"
                                        >
                                            Add
                                        </button>
                                    </div>
                                    <ul className="space-y-2">
                                        {users.map(u => (
                                            <li key={u} className="flex justify-between items-center bg-gray-50 p-2 rounded">
                                                <span>{u}</span>
                                                {users.length > 1 && (
                                                    <button onClick={() => handleRemoveUser(u)} className="text-red-400 px-2 py-1 hover:bg-red-50 rounded">
                                                        <i data-lucide="x" size="16"></i>
                                                    </button>
                                                )}
                                            </li>
                                        ))}
                                    </ul>
                                </div>

                                {/* Danger Zone: Reset Data */}
                                <div className="bg-red-50 p-4 rounded-xl shadow-sm border border-red-100">
                                    <h3 className="font-bold text-red-600 mb-2 flex items-center gap-2">
                                        <i data-lucide="trash-2" size="18"></i> Danger Zone
                                    </h3>
                                    <p className="text-xs text-red-500 mb-3">Note: This cannot be undone.</p>
                                    <button 
                                        onClick={handleResetData}
                                        className="w-full bg-red-600 text-white font-bold py-3 rounded-lg shadow-sm active:scale-95 transition"
                                    >
                                        Reset All Data
                                    </button>
                                </div>

                                <div className="text-center text-gray-400 text-xs">
                                    Travel Expenses Calculator v2.0 <br/> Powered by Kevin Tam
                                </div>
                            </div>
                        )}

                    </main>

                    {/* Navigation Bar */}
                    <nav className="bg-white border-t border-gray-200 fixed bottom-0 w-full max-w-md flex justify-around py-3 pb-safe z-20">
                        <button 
                            onClick={() => { resetForm(); setActiveTab('add'); }}
                            className={`flex flex-col items-center gap-1 text-xs ${activeTab === 'add' ? 'text-blue-600 font-bold' : 'text-gray-400'}`}
                        >
                            <i data-lucide="plus" size="24"></i>
                            Record
                        </button>
                        <button 
                            onClick={() => setActiveTab('list')}
                            className={`flex flex-col items-center gap-1 text-xs ${activeTab === 'list' ? 'text-blue-600 font-bold' : 'text-gray-400'}`}
                        >
                            <i data-lucide="list" size="24"></i>
                            Details ({expenses.length})
                        </button>
                        <button 
                            onClick={() => setActiveTab('settle')}
                            className={`flex flex-col items-center gap-1 text-xs ${activeTab === 'settle' ? 'text-blue-600 font-bold' : 'text-gray-400'}`}
                        >
                            <i data-lucide="users" size="24"></i>
                            Settlement
                        </button>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
