  apology:{label:"主動道歉",placeholder:"認低威，仲講得出口"}, emotion:{label:"提供情緒價值",placeholder:"聽你訴苦聽到深夜都冇彈過"},
  treat:{label:"請食飯",placeholder:"唔使你講已經買咗單"}, help:{label:"幫手做野",placeholder:"主動搞掂咗件麻煩事"},
  gift:{label:"送禮物 / 驚喜",placeholder:"無端端整咗個驚喜畀你"}, care:{label:"記得你講過嘅事",placeholder:"你隨口講過嘅小事，佢仲記得"},

};

// State
let db = { files: [] };
let currentSheet = null;
let activeFileId = null;
let activeEventId = null;

// Helpers
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const todayISO = () => new Date().toISOString().slice(0,10);
const evScore = e => e.type==="good" ? -e.severity : e.severity;
const rawScoreOf = f => f.events.reduce((s,e)=>s+evScore(e),0);
const scoreOf = f => Math.max(0, rawScoreOf(f) - (f.clearedScore||0));
function caseNo(f){ const d=new Date(f.created || Date.now()); return "DIU-"+d.getFullYear()+"-"+String(f.seq).padStart(3,"0"); }
function thresholdClause(t){
  return t===0
    ? "，惟鑑於《小氣簿》之執法標準具有高度彈性，並奉行「龍門任我搬」之原則，本人有權因應實際情況及個人意願，決定是否發出警告信。基於上述情況，本人現決定向你發出書面警告，以作正式紀錄。"
    : "，已超過 "+t+" 分門檻。基於上述情況，本人決定向你發出書面警告，以作正式紀錄。";
}
function statusOf(f){
  const sc=scoreOf(f), p = f.threshold>0 ? sc/f.threshold : 1;
  const pct = Math.min(100, Math.round(p*100));
  if(p>=1) return {pct,text:"嬲到核爆",color:"#A32D22",bg:"#F5DEDA",bar:"#A32D22"};
  if(p>=.6) return {pct,text:"佢GG了",color:"#B07A16",bg:"#F5E8CE",bar:"#B07A16"};
  if(sc>0) return {pct,text:"觀察中",color:"#2E4A43",bg:"#DCE6E1",bar:"#2E4A43"};
  return {pct,text:"表現良好",color:"#2E4A43",bg:"#DCE6E1",bar:"#2E4A43"};
}
function toChineseDate(d){
  const digits=["〇","一","二","三","四","五","六","七","八","九"];
  const year=String(d.getFullYear()).split("").map(c=>digits[+c]).join("");
  const num=n=>{ if(n<10) return digits[n]; if(n===10) return "十"; if(n<20) return "十"+digits[n%10]; const t=Math.floor(n/10),u=n%10; return digits[t]+"十"+(u?digits[u]:""); };
  return year+"年"+num(d.getMonth()+1)+"月"+num(d.getDate())+"日";
}

  return `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="46" fill="none" stroke="%23A32D22" stroke-width="4"/>
    <circle cx="50" cy="50" r="41" fill="none" stroke="%23A32D22" stroke-width="1.5"/>
    <text x="50" y="55" font-family="Noto Serif TC, serif" font-weight="700" font-size="18" fill="%23A32D22" text-anchor="middle" dominant-baseline="middle">${text}</text>
  </svg>`;
}

function initData(){
  try{ const r=localStorage.getItem(KEY); if(r) db=JSON.parse(r); }catch(e){}
  if(!db.files) db.files=[];
  if(!db.ownerName){
    document.getElementById("setupOverlay").style.display = "flex";
  }
  render();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} render(); }

// --- Rendering UI ---
function render(){
  // Stats
  const activeFiles = db.files.filter(f=>!f.inactive);
  const inactiveFiles = db.files.filter(f=>f.inactive);
  const totalEvents = db.files.reduce((acc,f)=>acc+f.events.length,0);
  const alertFiles = activeFiles.filter(f=>scoreOf(f)>=f.threshold);

  document.getElementById("statFiles").textContent = activeFiles.length;
  document.getElementById("statEvents").textContent = totalEvents;
  document.getElementById("statAlerts").textContent = alertFiles.length;
  
  const statAlertBox = document.getElementById("statAlertBox");
  if(alertFiles.length > 0){
    statAlertBox.style.borderColor = "#A32D22";
    statAlertBox.style.background = "#F5DEDA";
    document.getElementById("statAlerts").style.color = "#A32D22";
  } else {
    statAlertBox.style.borderColor = "#D8DAD2";
    statAlertBox.style.background = "#FCFCFA";
    document.getElementById("statAlerts").style.color = "#181A16";
  }

  // Active / No active
  const noActiveContainer = document.getElementById("noActiveContainer");
  const activeFilesList = document.getElementById("activeFilesList");
  activeFilesList.innerHTML = "";

  if(activeFiles.length === 0){
    noActiveContainer.style.display = "block";
  } else {
    noActiveContainer.style.display = "none";
    activeFiles.forEach(f => {
      const cNo = caseNo(f);
      const st = statusOf(f);
      const sc = scoreOf(f);
      const isTop = alertFiles.length > 0 && f === alertFiles[0];
      const borderColor = isTop ? "#A32D22" : "#D8DAD2";
      
      let html = `
      <section style="background:#FCFCFA;border:1px solid ${borderColor};border-radius:0 3px 3px 3px;position:relative">
        <div style="position:absolute;top:-23px;left:-1px;background:#FCFCFA;border:1px solid ${borderColor};border-bottom:none;border-radius:3px 12px 0 0;padding:4px 16px 3px 12px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;color:${isTop?'#A32D22':'#7C8177'};font-weight:${isTop?'700':'400'}">
          ${cNo}${isTop?' · 死KAML':''}
        </div>
        <div style="padding:24px 18px 16px;border-bottom:1px dashed #D8DAD2">
          <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
            <div style="font-family:'Noto Serif TC',serif;font-size:21px;font-weight:600;line-height:1.25;flex:1">${escapeHtml(f.name)}</div>
            <button onclick="openEditFile('${f.id}')" style="flex-shrink:0;padding:6px 8px;background:none;border:none;color:#ABAFA3;font-size:11px;cursor:pointer;white-space:nowrap">編輯資料</button>
            ${sc >= f.threshold ? `<button onclick="openNotice('${f.id}')" style="flex-shrink:0;padding:6px 12px;background:#A32D22;color:#FDF4F2;border:1px solid #A32D22;border-radius:2px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap">出警告信</button>` : `<button onclick="openVerbal('${f.id}')" style="flex-shrink:0;padding:6px 12px;background:#E8B923;color:#181A16;border:1px solid #E8B923;border-radius:2px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap">口頭警告</button>`}
          </div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7C8177;margin-top:3px">門檻：${f.threshold}分 · 建立於 ${f.created ? new Date(f.created).toISOString().slice(0,10) : ''}</div>
          <div style="margin-top:14px">
            <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px">
              <span style="font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600">${sc}<span style="font-size:13px;color:#7C8177;font-weight:400"> / ${f.threshold}</span></span>
              <span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;padding:3px 8px;border-radius:2px;background:${st.bg};color:${st.color}">${st.text}</span>
            </div>
            <div style="height:8px;background:#EAEBE4;border-radius:4px;overflow:hidden">
              <div style="height:100%;width:${st.pct}%;background:${st.bar};border-radius:4px"></div>
            </div>
          </div>
        </div>
        <div style="padding:4px 18px;max-height:240px;overflow-y:auto">
      `;

      if(f.events.length > 0){
        f.events.forEach(ev => {
          const isGood = ev.type === "good";
          const sign = isGood ? "-" : "+";
          const color = isGood ? "#2E4A43" : "#A32D22";
          const catObj = isGood ? GOOD_CATS[ev.cat] : CATS[ev.cat];
          html += `
          <div style="display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px solid #D8DAD2">
            <span style="font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:${color}">${sign}${ev.severity}</span>
            <div>
              <p style="font-size:12px;font-weight:600;margin:0;color:${color}">${catObj ? catObj.label : ev.cat}</p>
              <p style="font-size:10px;color:#7C8177;margin:3px 0 0"><span style="font-family:'IBM Plex Mono',monospace">${ev.date}</span>${ev.desc ? ' · '+escapeHtml(ev.desc) : ''}</p>
            </div>
            <div style="display:flex;gap:2px">
              <button onclick="editEvent('${f.id}','${ev.id}')" style="border:none;background:none;color:#7C8177;cursor:pointer;font-size:13px;padding:4px">✎</button>
              <button onclick="deleteEvent('${f.id}','${ev.id}')" style="border:none;background:none;color:#7C8177;cursor:pointer;font-size:15px;padding:4px">×</button>
            </div>
          </div>`;
        });
      } else {
        html += `<div style="padding:18px 0;color:#7C8177;font-size:13.5px;text-align:center">行為良好，未激嬲過你。</div>`;
      }

      const clearedScore = f.clearedScore || 0;
      html += `
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:4px;padding:14px 14px 16px;border-top:1px dashed #D8DAD2">
          <button onclick="openAddEvent('${f.id}')" style="flex:1;min-width:70px;padding:8px 6px;border:1px solid #B7BBAE;background:#FCFCFA;border-radius:2px;font-size:11.5px;font-weight:500;cursor:pointer">今次嬲咩</button>
          <button onclick="openAddGood('${f.id}')" style="flex:1;min-width:70px;padding:8px 6px;border:1px solid #2E4A43;color:#2E4A43;background:#FCFCFA;border-radius:2px;font-size:11.5px;font-weight:500;cursor:pointer">做咗好嘢</button>
          <button onclick="resetFileScore('${f.id}')" style="flex:1;min-width:60px;padding:8px 4px;border:none;background:none;color:#7C8177;border-radius:2px;font-size:11.5px;cursor:pointer">動態清零</button>
          <button onclick="restoreFileScore('${f.id}')" ${clearedScore===0?'disabled style="opacity:0.4;cursor:not-allowed"':''} style="flex:1;min-width:80px;padding:8px 4px;border:none;background:none;color:#2E4A43;border-radius:2px;font-size:11.5px;cursor:pointer">翻舊帳(+${clearedScore}分)</button>
          <button onclick="cutoffFile('${f.id}')" style="flex:1;min-width:50px;padding:8px 4px;border:none;background:none;color:#A32D22;border-radius:2px;font-size:11.5px;cursor:pointer">絕交</button>
        </div>
      </section>`;
      
      const div = document.createElement("div");
      div.innerHTML = html;
      activeFilesList.appendChild(div);
    });
  }

  // Inactive Files
  const inactiveContainer = document.getElementById("inactiveContainer");
  const inactiveFilesList = document.getElementById("inactiveFilesList");
  inactiveFilesList.innerHTML = "";
  if(inactiveFiles.length > 0){
    inactiveContainer.style.display = "block";
    inactiveFiles.forEach(f => {
      const badCount = f.events.filter(e=>e.type!=="good").length;
      const goodCount = f.events.filter(e=>e.type==="good").length;
      const div = document.createElement("div");
      div.innerHTML = `
        <section style="opacity:.6;filter:grayscale(.3);background:#FCFCFA;border:1px solid #D8DAD2;border-radius:3px;padding:16px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <div style="flex:1;min-width:140px">
            <div style="font-family:'Noto Serif TC',serif;font-size:17px;font-weight:600">${escapeHtml(f.name)}</div>
            <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#7C8177;margin-top:2px">已絕交 · 嬲咗${badCount}次．讚咗${goodCount}次</div>
          </div>
          <button onclick="makeFriendsAgain('${f.id}')" style="padding:7px 12px;border:1px solid #B7BBAE;background:#FCFCFA;border-radius:2px;font-size:12.5px;cursor:pointer">做返 Friend</button>
          <button onclick="permaDeleteFile('${f.id}')" style="padding:7px 10px;border:none;background:none;color:#7C8177;font-size:12px;cursor:pointer">永久銷毀</button>
        </section>`;
      inactiveFilesList.appendChild(div);
    });
  } else {
    inactiveContainer.style.display = "none";
  }
}

function escapeHtml(str){
  return (str||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// --- Action Handlers ---
document.getElementById("btnNewFile").onclick = () => {
  activeFileId = null;
  openNewFileModal();
};

      <input id="nfThresh" type="number" min="0" max="200" value="${f?f.threshold:REL_LEVELS.hibye.threshold}" style="width:100%;padding:10px 11px;border:1px solid #B7BBAE;border-radius:2px;font-size:14px;background:#fff">
      <div style="font-size:11px;color:#7C8177;margin-top:6px">填 0 即係「龍門任我搬」，即開file已核爆</div>
    </div>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#7C8177;border-top:1px dashed #D8DAD2;padding-top:12px;margin:16px 0 12px">內部資料 — 唔會出現喺警告信入面</div>
    <div style="margin-bottom:14px">
      <label style="display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#7C8177;margin-bottom:6px">電郵地址 用於發送警告信（選填）</label>
      <input id="nfEmail" type="email" value="${f&&f.email?escapeHtml(f.email):''}" placeholder="abc@example.com" style="width:100%;padding:10px 11px;border:1px solid #B7BBAE;border-radius:2px;font-size:14px;background:#fff">
    </div>
    <div style="display:flex;gap:10px">
      <button onclick="saveNewFile()" style="flex:1;padding:12px;background:#181A16;color:#F7F8F4;border:none;border-radius:2px;font-size:14.5px;font-weight:600;cursor:pointer">儲存</button>
      <button onclick="closeModal()" style="padding:12px 16px;background:none;border:1px solid #D8DAD2;border-radius:2px;color:#7C8177;cursor:pointer">取消</button>

  document.getElementById("sheetContent").innerHTML = content;

function onRelLevelChange(){
  const k = document.getElementById("nfRelLevel").value;
  if(REL_LEVELS[k]){
    document.getElementById("nfThresh").value = REL_LEVELS[k].threshold;
  }
}

function openEditFile(id){ openNewFileModal(id); }

function saveNewFile(){
  const name = document.getElementById("nfName").value.trim();
  if(!name){ alert("條仆街叫咩名？填低先。"); return; }
  const gender = document.getElementById("nfGender").value;
  const relLevel = document.getElementById("nfRelLevel").value;
  const threshold = parseInt(document.getElementById("nfThresh").value) || 0;
  const email = document.getElementById("nfEmail").value.trim();

  if(activeFileId){
    const f = db.files.find(x=>x.id===activeFileId);
    if(f){ Object.assign(f, {name, gender, relLevel, threshold, email}); }
  } else {
    db.files.push({
      id: uid(), seq: db.files.length+1, name, gender, relLevel, threshold, email,
      cutoff:"maybe", priority:"mid", note:"", created: Date.now(), events:[]
    });
  }
  closeModal();
  save();
}

function closeModal(){
  document.getElementById("modalOverlay").style.display = "none";
}

// --- Event Modals ---
function openAddEvent(fileId, eventId){
  activeFileId = fileId;
  activeEventId = eventId || null;
  const f = db.files.find(x=>x.id===fileId);
  const ev = eventId && f ? f.events.find(x=>x.id===eventId) : null;

  const catsHtml = Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${ev&&ev.cat===k?'selected':''}>${v.label}</option>`).join('');
  
  const content = `
    <h3 style="font-family:'Noto Serif TC',serif;font-size:18px;font-weight:600;margin:0 0 16px">${ev?'修改嬲事':'今次又嬲咩？'}</h3>
    <div style="margin-bottom:14px">
      <label style="display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#7C8177;margin-bottom:6px">類別</label>
      <select id="evCat" style="width:100%;padding:9px 11px;border:1px solid #B7BBAE;border-radius:2px;font-size:14px;background:#fff">${catsHtml}</select>
    </div>
    <div style="margin-bottom:14px">
      <label style="display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#7C8177;margin-bottom:6px">具體發生咗咩事？<span style="text-transform:none;letter-spacing:0;color:#B7BBAE"> 選填</span></label>
      <textarea id="evDesc" placeholder="就係睇佢唔順眼" style="width:100%;min-height:70px;padding:10px 11px;border:1px solid #B7BBAE;border-radius:2px;font-size:14px;background:#fff;resize:vertical">${ev&&ev.desc?escapeHtml(ev.desc):''}</textarea>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:14px">
      <div style="flex:1">
        <label style="display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#7C8177;margin-bottom:6px">日期</label>
        <input id="evDate" type="date" value="${ev?ev.date:todayISO()}" style="width:100%;padding:9px 11px;border:1px solid #B7BBAE;border-radius:2px;font-size:14px;background:#fff">
      </div>
    </div>
    <div style="margin-bottom:18px">
      <label style="display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#7C8177;margin-bottom:6px">嚴重程度</label>
      <div style="display:flex;align-items:center;gap:14px">
        <input id="evSevRange" type="range" min="1" max="11" step="1" value="${ev?(ev.severity===50?11:ev.severity):5}" oninput="onSevInput(this)" style="flex:1;accent-color:#2E4A43">
        <span id="evSevVal" style="font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;min-width:44px;text-align:right">${ev?(ev.severity===50?50:ev.severity):5}</span>
      </div>
      <p id="evSevHint" style="font-size:12.5px;color:#7C8177;margin-top:6px">${SEV_HINT[ev&&ev.severity!==50?ev.severity:5]||""}</p>
    </div>
    <div style="display:flex;gap:10px">
      <button onclick="saveEvent()" style="flex:1;padding:12px;background:#181A16;color:#F7F8F4;border:none;border-radius:2px;font-size:14.5px;font-weight:600;cursor:pointer">記低條數</button>
      <button onclick="closeModal()" style="padding:12px 16px;background:none;border:1px solid #D8DAD2;border-radius:2px;color:#7C8177;cursor:pointer">取消</button>
    </div>`;

  document.getElementById("sheetContent").innerHTML = content;
  document.getElementById("modalOverlay").style.display = "flex";
}

function onSevInput(el){
  const v = parseInt(el.value);
  const actual = v===11 ? 50 : v;
  document.getElementById("evSevVal").textContent = actual;
  document.getElementById("evSevHint").textContent = v===11 ? "馬德鐘：扣你50分" : (SEV_HINT[v]||"");
}

function saveEvent(){
  const cat = document.getElementById("evCat").value;
  const desc = document.getElementById("evDesc").value.trim();
  const date = document.getElementById("evDate").value || todayISO();
  const sevVal = parseInt(document.getElementById("evSevRange").value);
  const severity = sevVal === 11 ? 50 : sevVal;

  const f = db.files.find(x=>x.id===activeFileId);
  if(!f) return;

  if(activeEventId){
    const ev = f.events.find(x=>x.id===activeEventId);
    if(ev){ Object.assign(ev, {cat, desc, date, severity}); }
  } else {
    f.events.unshift({ id:uid(), type:"bad", cat, desc, date, severity, fixes: CATS[cat].fixes.slice(0,2) });
  }
  closeModal();
  save();
}

function editEvent(fileId, eventId){ openAddEvent(fileId, eventId); }
function deleteEvent(fileId, eventId){
  const f = db.files.find(x=>x.id===fileId);
  if(!f) return;
  f.events = f.events.filter(x=>x.id!==eventId);
  save();
}

      <div style="display:flex;align-items:center;gap:14px">

        <span id="gdSevVal" style="font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;min-width:44px;text-align:right">5</span>
      </div>
    </div>
    <div style="display:flex;gap:10px">
      <button onclick="saveGood()" style="flex:1;padding:12px;background:#2E4A43;color:#F7F8F4;border:none;border-radius:2px;font-size:14.5px;font-weight:600;cursor:pointer">抵銷分數</button>
      <button onclick="closeModal()" style="padding:12px 16px;background:none;border:1px solid #D8DAD2;border-radius:2px;color:#7C8177;cursor:pointer">取消</button>
    </div>`;

  document.getElementById("sheetContent").innerHTML = content;
  document.getElementById("modalOverlay").style.display = "flex";
}

function onGdSevInput(el){
  document.getElementById("gdSevVal").textContent = el.value;
}

function saveGood(){
  const cat = document.getElementById("gdCat").value;
  const desc = document.getElementById("gdDesc").value.trim();
  const date = document.getElementById("gdDate").value || todayISO();
  const severity = parseInt(document.getElementById("gdSevRange").value) || 5;

  const f = db.files.find(x=>x.id===activeFileId);
  if(!f) return;

  f.events.unshift({ id:uid(), type:"good", cat, desc, date, severity });
  closeModal();
  save();
}

// --- Score Management ---
function resetFileScore(fileId){
  const f = db.files.find(x=>x.id===fileId);
  if(!f) return;
  const currentRaw = rawScoreOf(f);
  if(currentRaw <= 0) return;
  if(confirm("動態清零會將現有分數暫時歸零（收納入舊帳），確定？")){
    f.clearedScore = (f.clearedScore || 0) + currentRaw;
    save();
  }
}

function restoreFileScore(fileId){
  const f = db.files.find(x=>x.id===fileId);
  if(!f) return;
  if(!f.clearedScore) return;
  if(confirm(`確定要翻舊帳，加回之前清零嘅 ${f.clearedScore} 分？`)){
    f.clearedScore = 0;
    save();
  }
}

function cutoffFile(fileId){
  const f = db.files.find(x=>x.id===fileId);
  if(!f) return;
  if(confirm(`確定要同「${f.name}」絕交？`)){
    f.inactive = true;
    save();
  }
}

function makeFriendsAgain(fileId){
  const f = db.files.find(x=>x.id===fileId);
  if(!f) return;
  f.inactive = false;
  save();
}

function permaDeleteFile(fileId){
  if(confirm("永久銷毀此卷宗將無法復原，確定？")){
    db.files = db.files.filter(x=>x.id!==fileId);
    save();
  }
}

// --- Import / Export / Demo / Wipe ---
document.getElementById("btnExport").onclick = () => {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
  const dlAnchor = document.createElement('a');
  dlAnchor.setAttribute("href", dataStr);
  dlAnchor.setAttribute("download", `siuheybook_backup_${todayISO()}.json`);
  document.body.appendChild(dlAnchor);
  dlAnchor.click();
  dlAnchor.remove();
};

const fileInput = document.getElementById("fileInput");
document.getElementById("btnImport").onclick = () => { fileInput.click(); };
fileInput.onchange = e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = event => {
    try {
      const parsed = JSON.parse(event.target.result);
      if(parsed && Array.isArray(parsed.files)){
        db = parsed;
        save();
        alert("匯入成功！");
      } else {
        alert("檔案格式不正確。");
      }
    } catch(err){ alert("解析 JSON 失敗。"); }
  };
  reader.readAsText(file);
};
